<style>
  .page-wrap { max-width: 640px; margin: 0 auto; padding: 1rem 1.25rem 2rem; width: 100%; }
  #poll-content { display: flex; flex-direction: column; gap: 1.1rem; }

  .hdr-pill .short { display: none; }
  @media (max-width: 430px) { .hdr-pill .long { display: none; } .hdr-pill .short { display: inline; } }

  /* EN-TÊTE DU SONDAGE */
  .event-header { display: flex; flex-direction: column; gap: 0.55rem; }
  .event-title { font-size: clamp(1.8rem, 7vw, 2.35rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; text-wrap: balance; overflow-wrap: anywhere; }
  .event-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .meta-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .meta-pill.closed { background: var(--yes); border-color: var(--yes); color: var(--on-yes); font-weight: 800; }
  .organizer-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: var(--maybe); color: var(--on-maybe); font-size: 0.76rem; font-weight: 800; }
  .organizer-badge svg { width: 13px; height: 13px; }
  .created-banner { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 800; color: var(--yes-ink); }
  .created-banner svg { width: 28px; height: 28px; padding: 5px; border-radius: 50%; background: var(--yes); color: var(--on-yes); animation: gm-pop var(--d-slow) var(--ease-spring); }

  /* PARTAGE */
  .share-section { background: var(--surface); border: 2px solid var(--edge-line); border-radius: var(--radius-lg); box-shadow: 4px 4px 0 var(--edge); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 10px; }
  .share-intro { font-size: 0.86rem; color: var(--ink-soft); line-height: 1.45; }
  .share-intro strong { color: var(--ink); font-weight: 800; }
  .share-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .share-url { flex: 1 1 100%; min-width: 0; font-size: 0.78rem; font-weight: 500; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--field); border: 2px solid var(--line); border-radius: 10px; padding: 7px 10px; }
  .btn-copy, .btn-whatsapp { flex: 1; padding: 9px 14px; border: 2px solid var(--edge); border-radius: 12px; font-size: 0.88rem; font-weight: 800; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: transform var(--d-fast) var(--ease-out), background-color var(--d-base) var(--ease-out); }
  .btn-copy { background: var(--action); color: var(--on-action); }
  .btn-copy.copied { background: var(--yes); color: var(--on-yes); }
  .btn-whatsapp { background: #25D366; color: #0b2e18; }
  .btn-copy:active, .btn-whatsapp:active { transform: scale(0.96); }
  .btn-whatsapp svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ONGLETS : la pastille glisse sous l'onglet actif */
  .tabs { position: relative; border-color: var(--edge-line); display: flex; padding: 4px; border-radius: 999px; background: var(--surface); border: 2px solid var(--edge); }
  .tab { position: relative; z-index: 1; flex: 1; padding: 0.55rem 0.4rem; background: none; border: none; font-size: 0.9rem; font-weight: 700; color: var(--ink-soft); cursor: pointer; border-radius: 999px; transition: color var(--d-base) var(--ease-out); white-space: nowrap; }
  .tab.active { color: var(--on-action); }
  .tab-indicator { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--action); transition: transform var(--d-base) var(--ease-out), width var(--d-base) var(--ease-out); }

  /* VOTE */
  #tab-vote, #tab-participants, #tab-results { display: flex; flex-direction: column; gap: 1rem; }
  .vote-name-row { background: var(--surface); border: 2px solid var(--edge-line); border-radius: var(--radius-lg); box-shadow: 4px 4px 0 var(--edge); padding: 1rem 1.1rem; }
  .edit-hint { font-size: 0.78rem; color: var(--ink-muted); margin-top: 8px; }
  .cal-tip { font-size: 0.85rem; color: var(--ink-soft); }

  .vote-cal-outer { background: var(--surface); border: 2px solid var(--edge-line); border-radius: var(--radius-lg); box-shadow: 4px 4px 0 var(--edge); padding: 1rem 1rem 1.1rem; display: flex; flex-direction: column; gap: 10px; }
  .vote-cal-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .vote-cal-month { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; }
  .cal-side-btn { width: auto; min-width: 34px; height: 34px; padding: 0 9px; border-radius: 999px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font-size: 0.78rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; transition: transform var(--d-fast) var(--ease-out); }
  .cal-side-btn .arr { display: flex; }
  .cal-side-btn:disabled { opacity: 0.25; cursor: default; }
  .cal-side-btn:active:not(:disabled) { transform: scale(0.92); }
  .cal-side-btn.has-dates { background: var(--pop); border-color: var(--pop); color: var(--on-pop); }
  .cal-side-label:empty { display: none; }
  .vote-cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .vcal-header { text-align: center; font-size: 0.68rem; font-weight: 700; color: var(--ink-muted); padding: 2px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .vcal-day { aspect-ratio: 1; max-width: 100%; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.92rem; font-weight: 600; border: 2px solid transparent; position: relative; font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; transition: background-color var(--d-fast) var(--ease-out), border-color var(--d-fast) var(--ease-out), color var(--d-fast) var(--ease-out); }
  .vcal-day.inactive { color: var(--ink-muted); opacity: 0.35; }
  .vcal-day.proposed { cursor: pointer; color: var(--ink); background: var(--field); border-color: var(--ink); font-weight: 800; }
  @media (hover: hover) { .vcal-day.proposed:not(.yes):not(.maybe):hover { background: var(--yes-soft); border-color: var(--yes); } }
  .vcal-day.proposed.yes { background: var(--yes); border-color: var(--yes); color: var(--on-yes); }
  .vcal-day.proposed.maybe { background: var(--maybe); border-color: var(--maybe); color: var(--on-maybe); }
  .vcal-day.pop { animation: gm-pop var(--d-slow) var(--ease-spring); }

  .vote-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--ink-soft); }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--ink); background: var(--field); }
  .legend-swatch.yes { background: var(--yes); border-color: var(--yes); }
  .legend-swatch.maybe { background: var(--maybe); border-color: var(--maybe); }
  .legend-swatch.no { background: var(--no); border-color: var(--no); }

  .btn-submit { width: 100%; padding: 1rem 1.1rem; border: 2px solid var(--edge); border-radius: var(--radius-lg); background: var(--action); color: var(--on-action); font-size: 1.02rem; font-weight: 800; cursor: pointer; box-shadow: 4px 4px 0 var(--pop); transition: transform var(--d-fast) var(--ease-out), box-shadow var(--d-fast) var(--ease-out), background-color var(--d-base) var(--ease-out), color var(--d-base) var(--ease-out); }
  .btn-submit:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--pop); }
  .btn-submit:disabled { opacity: 0.7; cursor: default; }
  .btn-submit.done { background: var(--yes); color: var(--on-yes); }
  .vote-msg { text-align: center; font-size: 0.88rem; font-weight: 700; color: var(--yes-ink); min-height: 1.3em; margin-top: -0.4rem; }
  .vote-msg.error { color: var(--no-ink); }

  /* RÉSULTATS */
  .results-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .results-count { font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); }
  .view-toggle { display: flex; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 3px; }
  .view-btn { padding: 5px 13px; background: none; border: none; border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .view-btn.active { background: var(--ink); color: var(--bg); }
  .choose-hint { font-size: 0.85rem; color: var(--ink-soft); }
  .results-list { display: flex; flex-direction: column; gap: 10px; }
  .result-item { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-lg); padding: 0.9rem 1.05rem; display: flex; flex-direction: column; gap: 8px; }
  .result-item.top { border-color: var(--edge); box-shadow: 4px 4px 0 var(--yes); }
  .result-top-row { display: flex; align-items: center; gap: 10px; }
  .rank-num { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: var(--field); color: var(--ink-soft); font-size: 0.78rem; font-weight: 800; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .rank-num.gold { background: var(--maybe); color: var(--on-maybe); }
  .result-date-label { font-size: 1rem; font-weight: 800; flex: 1; min-width: 0; }
  .result-score { font-size: 0.88rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .score-yes { color: var(--yes-ink); font-weight: 800; }
  .score-maybe { color: var(--maybe-ink); font-weight: 800; margin-left: 1px; }
  .score-total { color: var(--ink-muted); }
  .result-bar-stack { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--field); }
  .result-bar-yes { height: 100%; background: var(--yes); transition: width var(--d-slow) var(--ease-out); }
  .result-bar-maybe { height: 100%; background: var(--maybe); transition: width var(--d-slow) var(--ease-out); }
  .results-list.grow .result-bar-yes, .results-list.grow .result-bar-maybe { animation: bar-grow var(--d-slow) var(--ease-out) both; transform-origin: left; }
  .results-list.grow .result-item:nth-child(2) .result-bar-stack > * { animation-delay: .04s; }
  .results-list.grow .result-item:nth-child(3) .result-bar-stack > * { animation-delay: .08s; }
  .results-list.grow .result-item:nth-child(n+4) .result-bar-stack > * { animation-delay: .12s; }
  @keyframes bar-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .result-voters { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
  .voter-pill { display: inline-block; padding: 2px 9px; background: var(--yes-soft); color: var(--yes-ink); border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
  .voter-pill.maybe { background: var(--maybe-soft); color: var(--maybe-ink); }
  .voter-pill.maybe::after { content: ' ?'; opacity: 0.7; }
  .nobody { font-size: 0.82rem; color: var(--ink-muted); }
  .no-votes-msg { text-align: center; padding: 2.5rem 1rem; color: var(--ink-soft); font-size: 0.95rem; line-height: 1.6; }
  .result-bottom-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .btn-choose { flex-shrink: 0; padding: 6px 13px; border: 2px solid var(--ink); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 0.8rem; font-weight: 800; cursor: pointer; }
  .announce-block { display: flex; flex-direction: column; gap: 6px; }
  .announce-inline { margin-top: 4px; padding-top: 12px; border-top: 2px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
  .announce-inline .btn-submit { padding: 0.85rem; font-size: 0.95rem; }
  .announce-inline .link-btn { align-self: center; color: var(--ink-soft); text-decoration: none; }
  .announce-hint { text-align: center; font-size: 0.76rem; color: var(--ink-soft); line-height: 1.5; }

  .table-wrap { background: var(--surface); border: 2px solid var(--edge); border-radius: var(--radius-lg); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .vote-table { border-collapse: collapse; width: 100%; }
  .vote-table th, .vote-table td { padding: 6px 4px; text-align: center; min-width: 52px; }
  .vote-table thead th { padding: 9px 4px 7px; color: var(--ink-soft); font-weight: 400; border-bottom: 2px solid var(--line); }
  .vote-table .col-dow { display: block; font-size: 0.64rem; font-weight: 700; text-transform: uppercase; }
  .vote-table .col-day { display: block; font-size: 1.1rem; font-weight: 800; line-height: 1.1; color: var(--ink); }
  .vote-table .col-month { display: block; font-size: 0.64rem; }
  .vote-table thead th.best { background: var(--yes); color: var(--on-yes); }
  .vote-table thead th.best .col-day { color: var(--on-yes); }
  .vote-table td.best, .vote-table tfoot th.best { background: var(--yes-soft); }
  .vote-table .row-name { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding-left: 12px; font-size: 0.85rem; font-weight: 700; color: var(--ink); white-space: nowrap; max-width: 104px; min-width: 88px; overflow: hidden; text-overflow: ellipsis; }
  .vote-table tbody tr { border-bottom: 1px solid var(--line); }
  .vote-table .cell { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; background: var(--no-soft); color: var(--no-ink); }
  .vote-table .cell.yes { background: var(--yes); color: var(--on-yes); }
  .vote-table .cell.maybe { background: var(--maybe); color: var(--on-maybe); }
  .vote-table tfoot th, .vote-table tfoot td { padding: 10px 4px; font-size: 0.82rem; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .vote-table tfoot td.best { color: var(--yes-ink); }

  /* PARTICIPANTS */
  .participant-item { display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-lg); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--pop-soft); color: var(--pop-ink); font-size: 0.85rem; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .participant-name { font-size: 0.98rem; font-weight: 700; overflow-wrap: anywhere; }
  .participant-dates-summary { margin-left: auto; font-size: 0.8rem; font-weight: 600; color: var(--ink-muted); white-space: nowrap; }

  /* ÉTATS */
  .state-screen { text-align: center; padding: 5rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .state-screen p { color: var(--ink-soft); font-size: 0.95rem; }
  .state-screen h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }

  /* ORGANISATEUR SANS COMPTE */
  .device-card { background: var(--surface); border: 2px solid var(--edge-line); border-radius: var(--radius-lg); box-shadow: 4px 4px 0 var(--maybe); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 12px; }
  .device-card-top { display: flex; align-items: flex-start; gap: 12px; }
  .device-icon { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: var(--maybe); color: var(--on-maybe); display: flex; align-items: center; justify-content: center; }
  .device-icon svg { width: 20px; height: 20px; }
  .device-title { font-size: 0.95rem; font-weight: 800; margin-bottom: 3px; }
  .device-text { font-size: 0.82rem; color: var(--ink-soft); line-height: 1.45; }
  .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0.75rem; border: 2px solid var(--ink); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 0.92rem; font-weight: 800; cursor: pointer; }
  .btn-google:disabled { opacity: 0.6; cursor: default; }
  .g-badge { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 0.78rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .device-card .link-btn { align-self: center; color: var(--ink-soft); text-decoration: none; }
  .device-msg { text-align: center; font-size: 0.8rem; font-weight: 600; color: var(--no-ink); }
  .device-msg:empty { display: none; }

  /* VOTANT DE RETOUR */
  .welcome-card { background: var(--surface); border: 2px solid var(--edge-line); border-radius: var(--radius-lg); box-shadow: 4px 4px 0 var(--yes); padding: 1rem 1.1rem; display: flex; gap: 12px; align-items: flex-start; }
  .welcome-avatar { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; background: var(--yes); color: var(--on-yes); font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .welcome-title { font-size: 1rem; font-weight: 800; margin-bottom: 3px; }
  .welcome-text { font-size: 0.82rem; color: var(--ink-soft); line-height: 1.45; margin-bottom: 6px; }

  /* SONDAGE CLÔTURÉ */
  .final-banner { position: relative; background: var(--yes); color: var(--on-yes); border: 2px solid var(--edge-line); border-radius: var(--radius-lg); box-shadow: 4px 4px 0 var(--edge); padding: 1.2rem 1.15rem; display: flex; flex-direction: column; gap: 10px; }
  .final-banner.celebrate { animation: banner-slap var(--d-slow) var(--ease-spring); }
  @keyframes banner-slap { 0% { transform: scale(0.9) rotate(-2deg); } 100% { transform: none; } }
  .final-label { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 700; }
  .final-label svg { width: 16px; height: 16px; }
  .final-date { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; text-wrap: balance; }
  .final-counts { font-size: 0.88rem; font-weight: 600; }
  .btn-calendar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0.8rem; background: var(--surface); color: var(--ink); border: 2px solid var(--edge); border-radius: 999px; font-size: 0.92rem; font-weight: 800; cursor: pointer; }
  .btn-calendar svg { width: 17px; height: 17px; }
  .btn-reopen { padding: 0.6rem; background: none; color: inherit; border: 2px solid currentColor; border-radius: 999px; font-size: 0.85rem; font-weight: 700; cursor: pointer; opacity: 0.85; }
  .final-banner .device-msg { color: inherit; }
  .who-card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-lg); padding: 0.9rem 1.1rem; }

  /* Célébration à l'annonce : des gommettes éclatent depuis la bannière */
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .confetti i { position: absolute; left: 50%; top: 40%; width: 12px; height: 12px; border-radius: 50%; animation: confetti-burst 0.9s var(--ease-out) forwards; }
  @keyframes confetti-burst {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1); opacity: 0; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="logo intro" href="index.html" aria-label="Dooodle">D<span class="dot y"></span><span class="dot m"></span><span class="dot n"></span>dle</a>
  <span class="spacer"></span>
  <a class="hdr-pill primary" id="btn-new-poll" href="index.html"></a>
  <a class="hdr-icon" id="account-link" href="sondages.html" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4.2 4.1-6.5 8-6.5s7 2.3 8 6.5"></path></svg>
  </a>
  <div class="lang-toggle">
    <button class="lang-btn" id="lang-fr">FR</button>
    <button class="lang-btn" id="lang-en">EN</button>
  </div>
</header>

<div class="page-wrap">
  <div class="state-screen" id="loading-screen">
    <div class="loader"><span></span><span></span><span></span></div>
    <p id="loading-poll-text"></p>
  </div>
  <div class="state-screen" id="error-screen" style="display:none;">
    <h2 id="err-title"></h2>
    <p id="err-sub"></p>
  </div>
  <div id="poll-content" style="display:none;"></div>
</div>

<footer class="site-footer">
  <div class="theme-switch" id="theme-switch"></div>
  <a class="powered-by" href="https://nuxo.be" target="_blank" rel="noopener">Powered by <img src="images/nuxo-logo.svg" alt="Nuxo"></a>
  <span id="footer-tagline"></span>
</footer>

<script src="i18n.js?v=20261019a"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=20261014b"></script>
<script src="auth.js?v=20261014b"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const pollId = urlParams.get('id');
  // The link people share never carries the "just created" marker
  const shareUrl = `${location.origin}${location.pathname}?id=${encodeURIComponent(pollId || '')}`;
  const justCreated = urlParams.get('created') === '1';
  if (justCreated) history.replaceState(null, '', shareUrl);

  // Per-device memory only. Some browsers block it (private mode): everything works without.
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch(e) {} },
    del(k) { try { localStorage.removeItem(k); } catch(e) {} },
  };

  let poll = null;
  let selectedDates = new Map(); // key → 'yes' | 'maybe'
  let vcalYear, vcalMonth;
  let editingExistingVoter = null;
  let voteMsgTimer = null;
  let currentUser = null;   // organiser session, if any (participants have none)
  let welcomeName = null;   // voter remembered on this device and greeted by name
  let chosenDate = null;    // organiser's pick, before announcing it
  let resultsView = store.get('dooodle-results-view') === 'table' ? 'table' : 'ranking';

  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>';
  const ICON_STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg>';
  const ICON_CALENDAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>';
  const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>';
  const ICON_DEVICE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 16V6.5a2 2 0 012-2h11a2 2 0 012 2V8"></path><path d="M1.5 19.5h11"></path><rect x="15" y="10" width="7.5" height="11" rx="1.5"></rect><path d="M18 18.5h1.5"></path></svg>';

  function isOwner() { return !!(poll && currentUser && poll.ownerUid && poll.ownerUid === currentUser.uid); }
  // A closed poll without a valid final date is treated as open
  function isClosed() { return !!(poll && poll.closed === true && poll.dates.includes(poll.finalDate)); }

  /* --- Helpers --- */
  function formatDate(str) { return new Date(str+'T12:00:00').toLocaleDateString(t().locale,{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
  function formatDateNoYear(str) { return new Date(str+'T12:00:00').toLocaleDateString(t().locale,{weekday:'long',day:'numeric',month:'long'}); }
  function formatDateShort(str) { return new Date(str+'T12:00:00').toLocaleDateString(t().locale,{weekday:'short',day:'numeric',month:'short'}); }
  function getInitials(name) { return name.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2); }
  function cap(str) { return str.charAt(0).toUpperCase()+str.slice(1); }
  function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // Convert legacy vote format (Array of dates) to new format ({date: 'yes'}).
  // Only 'yes' / 'maybe' are kept: the state ends up in a class attribute.
  function normalizeVote(vote) {
    if (Array.isArray(vote)) {
      const obj = {};
      vote.forEach(d => { obj[d] = 'yes'; });
      return obj;
    }
    const obj = {};
    Object.entries(vote || {}).forEach(([d, state]) => {
      if (state === 'yes' || state === 'maybe') obj[d] = state;
    });
    return obj;
  }

  /* --- Load poll with live updates --- */
  // What changes the page layout (as opposed to a new vote, which only refreshes counts)
  function layoutKey(p) { return JSON.stringify([p.closed === true, p.finalDate || '', p.ownerUid || '']); }

  function loadPoll() {
    if(!pollId){showError();return;}
    let errorShown = false;
    db.collection('polls').doc(pollId).onSnapshot(snap => {
      if(!snap.exists){errorShown=true;showError();return;}
      const previous = poll;
      poll = snap.data();
      if (previous === null) {
        // Returning voter on this device: greet them with their availability loaded
        const remembered = store.get('dooodle-voter-' + pollId);
        const key = remembered ? findVoterKey(remembered) : null;
        if (key && !isClosed()) { welcomeName = key; loadVoterSelection(key); }
        renderPoll();
        if (isClosed()) switchTab('results');
      } else if (errorShown || layoutKey(previous) !== layoutKey(poll)) {
        // Also back from a deletion that the server refused: rebuild the hidden page
        errorShown = false;
        const justAnnounced = previous.closed !== true && isClosed();
        rerender();
        if (justAnnounced) celebrate();
      } else {
        // Live update: refresh counts + the currently visible data tab,
        // WITHOUT touching the vote calendar (preserves the user's in-progress selection).
        refreshLiveCounts();
        const activeTabId = document.querySelector('.tab.active')?.id;
        if (activeTabId === 'tab-btn-participants') renderParticipants();
        if (activeTabId === 'tab-btn-results') renderResults();
      }
    }, err => { console.error(err); showError(); });
  }

  function refreshLiveCounts() {
    const voters = Object.keys(poll.votes||{});
    const pill = document.getElementById('voters-pill');
    const cnt = document.getElementById('participants-count');
    if(pill) pill.textContent = t().participants(voters.length);
    if(cnt) cnt.textContent = `(${voters.length})`;
  }

  function showError() {
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('poll-content').style.display='none';
    document.getElementById('error-screen').style.display='block';
  }

  /* --- Render main poll content --- */
  function shareSectionHtml() {
    return `
      <div class="share-section">
        <div class="share-intro">${t().shareIntro}</div>
        <div class="share-row">
          <span class="share-url">${escHtml(shareUrl)}</span>
          <button class="btn-copy" id="copy-btn">${t().btnCopy}</button>
          <a class="btn-whatsapp" id="whatsapp-btn" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.118 1.528 5.845L.057 23.882l6.197-1.624A11.934 11.934 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.894a9.867 9.867 0 01-5.031-1.378l-.36-.214-3.733.979 1.001-3.656-.235-.374A9.861 9.861 0 012.106 12C2.106 6.535 6.535 2.106 12 2.106c5.466 0 9.894 4.429 9.894 9.894 0 5.466-4.428 9.894-9.894 9.894z"/></svg>
            ${t().btnWhatsapp}
          </a>
        </div>
      </div>`;
  }

  // Closed poll: the announced date, who is coming, and a calendar file
  function finalBannerHtml(owner) {
    const yes = [], maybe = [];
    Object.entries(poll.votes || {}).forEach(([name, vote]) => {
      const state = normalizeVote(vote)[poll.finalDate];
      if (state === 'yes') yes.push(name); else if (state === 'maybe') maybe.push(name);
    });
    const who = yes.length + maybe.length === 0 ? '' : `
      <div class="who-card">
        <span class="field-label">${t().whoComes}</span>
        <div class="result-voters">
          ${yes.map(n => `<span class="voter-pill">${escHtml(n)}</span>`).join('')}
          ${maybe.map(n => `<span class="voter-pill maybe">${escHtml(n)}</span>`).join('')}
        </div>
      </div>`;
    return `
      <div class="final-banner">
        <div class="final-label">${ICON_CALENDAR}${t().finalDateLabel}</div>
        <div class="final-date">${escHtml(cap(formatDate(poll.finalDate)))}</div>
        <div class="final-counts">${t().finalCounts(yes.length, maybe.length)}</div>
        <button class="btn-calendar" id="btn-ics">${ICON_PLUS}${t().btnAddCalendar}</button>
        ${owner ? `<button class="btn-reopen" id="btn-reopen">${t().btnReopen}</button><div class="device-msg" id="owner-msg"></div>` : ''}
      </div>${who}`;
  }

  // Shown to an organiser who has no account: the poll only exists on this device
  function deviceCardHtml() {
    return `
      <div class="device-card">
        <div class="device-card-top">
          <div class="device-icon">${ICON_DEVICE}</div>
          <div>
            <div class="device-title">${t().deviceTitle}</div>
            <div class="device-text">${t().deviceText}</div>
          </div>
        </div>
        <button class="btn-google" id="btn-google"><span class="g-badge">G</span>${t().btnGoogle}</button>
        <button class="link-btn" id="btn-later">${t().btnLater}</button>
        <div class="device-msg" id="google-msg"></div>
      </div>`;
  }

  function voteFormHtml() {
    return `
        <div class="welcome-card" id="welcome-card" style="display:none;">
          <div class="welcome-avatar" id="welcome-avatar"></div>
          <div>
            <div class="welcome-title" id="welcome-title"></div>
            <div class="welcome-text">${t().welcomeBackText}</div>
            <button class="link-btn" id="btn-not-me">${t().notMe}</button>
          </div>
        </div>
        <div class="vote-name-row" id="vote-name-row">
          <label class="field-label" for="voter-name">${t().labelName}</label>
          <input type="text" id="voter-name" placeholder="${t().placeholderName}" maxlength="40" />
          <div class="edit-hint" id="edit-hint">${t().editHint}</div>
        </div>
        <p class="cal-tip">${t().calTip}</p>
        <div class="vote-cal-outer">
          <div class="vote-cal-top">
            <button class="cal-side-btn" id="vcal-prev" aria-label="‹">
              <span class="arr"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></span>
              <span class="cal-side-label" id="vcal-prev-label"></span>
            </button>
            <div class="vote-cal-month" id="vcal-month-label"></div>
            <button class="cal-side-btn" id="vcal-next" aria-label="›">
              <span class="cal-side-label" id="vcal-next-label"></span>
              <span class="arr"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
            </button>
          </div>
          <div class="vote-cal-grid" id="vcal-grid"></div>
          <div class="vote-legend">
            <span class="legend-item"><span class="legend-swatch yes"></span>${t().legendYes}</span>
            <span class="legend-item"><span class="legend-swatch maybe"></span>${t().legendMaybe}</span>
            <span class="legend-item"><span class="legend-swatch"></span>${t().legendNo}</span>
          </div>
        </div>
        <button class="btn-submit" id="btn-submit">${t().btnSubmit}</button>
        <div class="vote-msg" id="vote-msg"></div>`;
  }

  function renderPoll() {
    document.title = `${poll.title} | Dooodle`;
    document.getElementById('loading-screen').style.display='none';
    // A rejected write can briefly make the poll look deleted: clear that state when it comes back
    document.getElementById('error-screen').style.display='none';
    const content = document.getElementById('poll-content');
    content.style.display='';

    const voters = Object.keys(poll.votes||{});
    const dateCount = poll.dates.length;
    const owner = isOwner(), closed = isClosed();
    const showDeviceCard = owner && currentUser.isAnonymous && !store.get('dooodle-later-' + pollId);

    content.innerHTML = `
      ${justCreated ? `<div class="created-banner">${ICON_CHECK}${t().createdTitle}</div>` : ''}
      <div class="event-header">
        <div class="event-title">${escHtml(poll.title)}</div>
        <div class="event-meta">
          <span class="meta-pill">${t().dateProposed(dateCount)}</span>
          <span class="meta-pill" id="voters-pill">${t().participants(voters.length)}</span>
          ${closed ? `<span class="meta-pill closed">${t().closedPill}</span>` : ''}
        </div>
        ${owner ? `<div class="organizer-badge">${ICON_STAR}${t().organizerBadge}</div>` : ''}
      </div>
      ${closed ? finalBannerHtml(owner) : shareSectionHtml()}
      ${showDeviceCard ? deviceCardHtml() : ''}
      <div class="tabs">
        <span class="tab-indicator" aria-hidden="true"></span>
        <button class="tab active" id="tab-btn-vote">${t().tabVote}</button>
        <button class="tab" id="tab-btn-participants">${t().tabParticipants} <span id="participants-count">(${voters.length})</span></button>
        <button class="tab" id="tab-btn-results">${t().tabResults}</button>
      </div>
      <div id="tab-vote">
        ${closed ? `<div class="no-votes-msg">${t().votesClosed}</div>` : voteFormHtml()}
      </div>
      <div id="tab-participants" style="display:none;"></div>
      <div id="tab-results" style="display:none;"></div>
    `;

    // Wire up events (each block exists only in some states)
    const on = (id, handler) => document.getElementById(id)?.addEventListener('click', handler);
    document.getElementById('voter-name')?.addEventListener('input', onVoterNameInput);
    on('copy-btn', copyLink);
    const waBtn = document.getElementById('whatsapp-btn');
    if (waBtn) {
      waBtn.href = 'https://wa.me/?text=' + encodeURIComponent(t().waMessage(poll.title, shareUrl));
    }
    on('btn-submit', submitVote);
    on('btn-not-me', forgetVoter);
    on('btn-ics', downloadCalendarFile);
    on('btn-reopen', reopenPoll);
    on('btn-google', connectGoogle);
    on('btn-later', () => { store.set('dooodle-later-' + pollId, '1'); rerender(); });
    on('tab-btn-vote', () => switchTab('vote'));
    on('tab-btn-participants', () => switchTab('participants'));
    on('tab-btn-results', () => switchTab('results'));

    if (!closed) {
      initVoteCalendar();
      applyWelcomeState();
    }
    // First placement without sliding, then again once the font is in (tab widths change)
    const pill = content.querySelector('.tab-indicator');
    pill.style.transition = 'none';
    moveTabIndicator();
    requestAnimationFrame(() => { pill.style.transition = ''; });
    document.fonts?.ready.then(moveTabIndicator);
  }

  // Rebuilds the page (language, organiser session, poll closed or reopened)
  // while keeping what the visitor was doing.
  function rerender() {
    if (!poll) return;
    const typedName = document.getElementById('voter-name')?.value || '';
    const activeTab = document.querySelector('.tab.active')?.id?.replace('tab-btn-','') || 'vote';
    renderPoll();
    const input = document.getElementById('voter-name');
    if (input) {
      input.value = welcomeName || typedName;
      if (editingExistingVoter) document.getElementById('edit-hint').textContent = t().editLoadedHint(editingExistingVoter);
    }
    switchTab(activeTab);
  }

  /* --- Returning voter --- */
  function rememberVoter(name) {
    store.set('dooodle-voter-' + pollId, name);
    store.set('dooodle-name', name);
  }

  // Swaps the name field for a greeting when this device already voted here
  function applyWelcomeState() {
    const card = document.getElementById('welcome-card');
    const row = document.getElementById('vote-name-row');
    const btn = document.getElementById('btn-submit');
    if (!card || !row || !btn) return;
    card.style.display = welcomeName ? 'flex' : 'none';
    row.style.display = welcomeName ? 'none' : '';
    if (!btn.classList.contains('done')) btn.textContent = welcomeName ? t().btnUpdate : t().btnSubmit;
    if (welcomeName) {
      document.getElementById('voter-name').value = welcomeName;
      document.getElementById('welcome-avatar').textContent = getInitials(welcomeName);
      document.getElementById('welcome-title').textContent = t().welcomeBack(welcomeName);
    }
  }

  function forgetVoter() {
    store.del('dooodle-voter-' + pollId);
    welcomeName = null;
    editingExistingVoter = null;
    selectedDates.clear();
    const input = document.getElementById('voter-name');
    input.value = '';
    document.getElementById('edit-hint').textContent = t().editHint;
    applyWelcomeState();
    renderVoteCalendar();
    input.focus();
  }

  /* --- Organiser --- */
  async function connectGoogle() {
    const btn = document.getElementById('btn-google');
    const msg = document.getElementById('google-msg');
    btn.disabled = true; msg.textContent = '';
    try {
      const user = await signInWithGoogle();
      if (user) { currentUser = auth.currentUser; updateAccountLink(); rerender(); return; }
    } catch(e) {
      if (!isUserCancel(e)) { console.error(e); msg.textContent = t().errGoogle; }
    }
    btn.disabled = false;
  }

  async function announceDate() {
    const btn = document.getElementById('btn-announce');
    btn.disabled = true;
    try {
      await db.collection('polls').doc(pollId).update({ closed: true, finalDate: chosenDate });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch(e) {
      console.error(e);
      btn.disabled = false;
      document.getElementById('owner-msg').textContent = t().errOwnerAction;
    }
  }

  async function reopenPoll() {
    const btn = document.getElementById('btn-reopen');
    btn.disabled = true;
    try {
      await db.collection('polls').doc(pollId).update({ closed: false, finalDate: firebase.firestore.FieldValue.delete() });
    } catch(e) {
      console.error(e);
      btn.disabled = false;
      document.getElementById('owner-msg').textContent = t().errOwnerAction;
    }
  }

  // All-day event, opened by the phone's or computer's calendar app
  function downloadCalendarFile() {
    const day = poll.finalDate.replace(/-/g, '');
    const next = new Date(poll.finalDate + 'T12:00:00'); next.setDate(next.getDate() + 1);
    const pad = n => String(n).padStart(2, '0');
    const end = `${next.getFullYear()}${pad(next.getMonth()+1)}${pad(next.getDate())}`;
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const text = str => String(str).replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\r?\n/g, '\\n');
    const ics = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Dooodle//doodle.nuxo.be//FR', 'BEGIN:VEVENT',
      `UID:${pollId}@doodle.nuxo.be`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${day}`, `DTEND;VALUE=DATE:${end}`,
      `SUMMARY:${text(poll.title)}`, `URL:${shareUrl}`,
      'END:VEVENT', 'END:VCALENDAR'
    ].join('\r\n');
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    link.download = `${pollId}.ics`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }

  /* --- Auto-load existing voter's dates when name matches --- */
  // "marie", "Marie " and "MARIE" are the same voter
  function cleanName(str) { return str.trim().replace(/\s+/g, ' '); }
  function findVoterKey(name) {
    const target = cleanName(name).toLocaleLowerCase();
    return Object.keys(poll.votes || {}).find(k => cleanName(k).toLocaleLowerCase() === target) || null;
  }

  // Loads a voter's saved dates into the calendar selection
  function loadVoterSelection(name) {
    editingExistingVoter = name;
    selectedDates.clear();
    Object.entries(normalizeVote(poll.votes[name]))
      .filter(([date]) => poll.dates.includes(date))
      .forEach(([date, state]) => selectedDates.set(date, state));
    const firstSelected = [...selectedDates.keys()].sort()[0];
    if (firstSelected) {
      vcalYear = parseInt(firstSelected.slice(0,4));
      vcalMonth = parseInt(firstSelected.slice(5,7));
    }
  }

  function onVoterNameInput() {
    const name = findVoterKey(document.getElementById('voter-name').value);
    const hint = document.getElementById('edit-hint');
    if (name) {
      if (editingExistingVoter !== name) {
        loadVoterSelection(name);
        renderVoteCalendar();
        if (hint) hint.textContent = t().editLoadedHint(name);
      }
    } else if (editingExistingVoter) {
      // The loaded dates belong to someone else: don't carry them over to this new name
      editingExistingVoter = null;
      selectedDates.clear();
      renderVoteCalendar();
      if (hint) hint.textContent = t().editHint;
    }
  }

  /* --- Vote calendar --- */
  function initVoteCalendar() {
    // Keep the month already on screen (re-render, or a returning voter's first date)
    if (vcalYear === undefined) {
      const firstDate = poll.dates[0];
      vcalYear  = parseInt(firstDate.slice(0,4));
      vcalMonth = parseInt(firstDate.slice(5,7));
    }

    document.getElementById('vcal-prev').onclick = () => {
      vcalMonth--; if(vcalMonth<1){vcalMonth=12;vcalYear--;} renderVoteCalendar();
    };
    document.getElementById('vcal-next').onclick = () => {
      vcalMonth++; if(vcalMonth>12){vcalMonth=1;vcalYear++;} renderVoteCalendar();
    };
    renderVoteCalendar();
  }

  function renderVoteCalendar() {
    const grid = document.getElementById('vcal-grid');
    const label = document.getElementById('vcal-month-label');
    const prevBtn = document.getElementById('vcal-prev');
    const nextBtn = document.getElementById('vcal-next');
    if(!grid || !label) return;

    const proposedSet = new Set(poll.dates);
    const monthKeys = poll.dates.map(d=>d.slice(0,7));
    const minKey = monthKeys[0];
    const maxKey = monthKeys[monthKeys.length-1];
    const curKey = `${vcalYear}-${String(vcalMonth).padStart(2,'0')}`;

    const hasPrev = curKey > minKey;
    const hasNext = curKey < maxKey;

    prevBtn.disabled = !hasPrev;
    prevBtn.classList.toggle('has-dates', hasPrev);
    nextBtn.disabled = !hasNext;
    nextBtn.classList.toggle('has-dates', hasNext);

    const prevLabel = document.getElementById('vcal-prev-label');
    const nextLabel = document.getElementById('vcal-next-label');
    if (prevLabel) {
      const pm = vcalMonth === 1 ? 12 : vcalMonth - 1;
      const py = vcalMonth === 1 ? vcalYear - 1 : vcalYear;
      prevLabel.textContent = hasPrev ? cap(new Date(py, pm-1, 1).toLocaleDateString(t().locale, {month:'short'})) : '';
    }
    if (nextLabel) {
      const nm = vcalMonth === 12 ? 1 : vcalMonth + 1;
      const ny = vcalMonth === 12 ? vcalYear + 1 : vcalYear;
      nextLabel.textContent = hasNext ? cap(new Date(ny, nm-1, 1).toLocaleDateString(t().locale, {month:'short'})) : '';
    }

    label.textContent = cap(new Date(vcalYear, vcalMonth-1, 1).toLocaleDateString(t().locale,{month:'long',year:'numeric'}));

    const daysInMonth = new Date(vcalYear, vcalMonth, 0).getDate();
    let startDow = new Date(vcalYear, vcalMonth-1, 1).getDay();
    startDow = (startDow+6)%7;

    let cells = t().dayHeaders.map(h=>`<div class="vcal-header">${h}</div>`).join('');
    for(let i=0;i<startDow;i++) cells+='<div class="vcal-day empty"></div>';
    for(let day=1;day<=daysInMonth;day++){
      const key=`${vcalYear}-${String(vcalMonth).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isP=proposedSet.has(key);
      const state = selectedDates.get(key); // undefined | 'yes' | 'maybe'
      const stateClass = isP ? ` proposed${state?(' '+state):''}` : ' inactive';
      cells+=`<div class="vcal-day${stateClass}" ${isP?`data-key="${key}"`:''}>${day}</div>`;
    }

    grid.innerHTML = cells;
    // Event delegation: single listener on the grid container, replaced on each render
    // This prevents double-handler bugs from successive renderVoteCalendar calls.
    grid.onclick = (event) => {
      const el = event.target.closest('.vcal-day.proposed');
      if (!el || !grid.contains(el)) return;
      const k = el.dataset.key;
      if (!k) return;
      const current = selectedDates.get(k);
      // Cycle: undefined → yes → maybe → undefined
      if (current === undefined) selectedDates.set(k, 'yes');
      else if (current === 'yes') selectedDates.set(k, 'maybe');
      else selectedDates.delete(k);
      // Update only this cell's state classes
      el.classList.remove('yes', 'maybe', 'pop');
      const newState = selectedDates.get(k);
      if (newState) { el.classList.add(newState); void el.offsetWidth; el.classList.add('pop'); }
    };
  }

  /* --- Submit vote --- */
  async function submitVote() {
    if (isClosed()) return;
    // Reuse the existing key if this voter already voted under another casing
    const typed=cleanName(document.getElementById('voter-name').value);
    const name=findVoterKey(typed) || typed;
    const btn=document.getElementById('btn-submit');
    if(!name){showVoteMsg(t().errNoName,true);return;}
    btn.disabled=true; btn.textContent=t().btnSubmitting;
    try {
      // Atomic targeted write: only updates this voter's field, never overwrites
      // the whole votes map. This prevents clobbering concurrent votes from others.
      // lastVoter tells the security rules which vote to validate
      const voteData = Object.fromEntries([...selectedDates].filter(([d]) => poll.dates.includes(d)));
      await db.collection('polls').doc(pollId).update(
        new firebase.firestore.FieldPath('votes', name), voteData,
        'lastVoter', name
      );
      // Local optimistic update (the snapshot listener will also confirm it)
      if (!poll.votes) poll.votes = {};
      poll.votes[name] = voteData;
      showVoteMsg(t().successVote(name));
      flashDone(btn);
      // This device now belongs to that voter: next visit starts from their dates
      rememberVoter(name);
      welcomeName = name;
      loadVoterSelection(name);
      document.getElementById('edit-hint').textContent = t().editLoadedHint(name);
      renderVoteCalendar();
      refreshLiveCounts();
    } catch(e){ console.error(e); showVoteMsg(t().errSubmit,true); }
    btn.disabled=false;
    applyWelcomeState();
    // Restart the timer, otherwise a previous vote's timer erases this message
    clearTimeout(voteMsgTimer);
    voteMsgTimer = setTimeout(()=>showVoteMsg(''),4000);
  }

  function showVoteMsg(txt,isError=false){
    const el=document.getElementById('vote-msg');
    if(!el) return;
    el.textContent=txt; el.className='vote-msg'+(isError?' error':'');
  }

  /* --- Tabs --- */
  function switchTab(tab){
    ['vote','participants','results'].forEach(name => {
      document.getElementById(`tab-btn-${name}`)?.classList.toggle('active', name===tab);
      const pane=document.getElementById(`tab-${name}`);
      if(pane) pane.style.display = name===tab ? '' : 'none';
    });
    moveTabIndicator();
    if(tab==='participants') renderParticipants();
    if(tab==='results') renderResults(true);
  }

  // The dark pill slides under the active tab
  function moveTabIndicator() {
    const bar = document.querySelector('.tabs');
    const active = bar?.querySelector('.tab.active');
    const pill = bar?.querySelector('.tab-indicator');
    if (!active || !pill) return;
    pill.style.width = active.offsetWidth + 'px';
    pill.style.transform = `translateX(${active.offsetLeft}px)`;
  }
  window.addEventListener('resize', moveTabIndicator);

  // The save button turns green for a moment: the vote went through
  function flashDone(btn) {
    btn.classList.add('done');
    btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('done'); applyWelcomeState(); }, 1400);
  }

  // Announced date: a handful of stickers burst out of the banner
  function celebrate() {
    const banner = document.querySelector('.final-banner');
    if (!banner || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    banner.classList.add('celebrate');
    const colors = ['var(--maybe)', 'var(--no)', 'var(--pop)', 'var(--surface)']; // no green: the banner is green
    const layer = document.createElement('div');
    layer.className = 'confetti';
    layer.innerHTML = Array.from({ length: 18 }, (_, i) => {
      const angle = (i / 18) * Math.PI * 2 + Math.random() * 0.3;
      const dist = 90 + Math.random() * 70;
      return `<i style="background:${colors[i % colors.length]};--x:${Math.round(Math.cos(angle) * dist)}px;--y:${Math.round(Math.sin(angle) * dist * 0.7)}px;animation-delay:${Math.round(Math.random() * 80)}ms"></i>`;
    }).join('');
    banner.appendChild(layer);
    setTimeout(() => layer.remove(), 1200);
  }

  function renderParticipants(){
    const el=document.getElementById('tab-participants'); if(!el) return;
    const votes=poll.votes||{}, names=Object.keys(votes);
    if(names.length===0){el.innerHTML=`<div class="no-votes-msg">${t().noParticipants}</div>`;return;}
    el.innerHTML=names.map(name=>{
      const v = normalizeVote(votes[name]);
      const count = Object.keys(v).length;
      return `<div class="participant-item">
        <div class="avatar">${escHtml(getInitials(name))}</div>
        <div><div class="participant-name">${escHtml(name)}</div></div>
        <div class="participant-dates-summary">${t().datesAvail(count)}</div>
      </div>`;
    }).join('');
  }

  // Dates ranked by weighted score: yes=1, maybe=0.5, then by number of "yes"
  function rankDates() {
    const votes = poll.votes || {};
    return poll.dates.map(d => {
      const yes = [], maybe = [];
      Object.entries(votes).forEach(([name, vote]) => {
        const v = normalizeVote(vote);
        if (v[d] === 'yes') yes.push(name);
        else if (v[d] === 'maybe') maybe.push(name);
      });
      return { date: d, yes, maybe, score: yes.length + maybe.length * 0.5 };
    }).sort((a, b) => b.score - a.score || b.yes.length - a.yes.length);
  }

  function renderResults(animate){
    const el=document.getElementById('tab-results'); if(!el) return;
    const votes=poll.votes||{}, totalVoters=Object.keys(votes).length;
    if(totalVoters===0){el.innerHTML=`<div class="no-votes-msg">${t().noVotes}</div>`;return;}

    const scores = rankDates();
    const closed = isClosed();
    const choosing = isOwner() && !closed;
    // Nothing is picked until the organiser clicks: until then the best ranked date is highlighted
    if (chosenDate && !poll.dates.includes(chosenDate)) chosenDate = null;
    const picked = choosing ? chosenDate : null;
    const highlighted = closed ? poll.finalDate : picked || scores[0].date;

    el.innerHTML = `
      <div class="results-header">
        <span class="results-count">${t().voted(totalVoters)}</span>
        <div class="view-toggle">
          <button class="view-btn ${resultsView==='ranking'?'active':''}" data-view="ranking">${t().viewRanking}</button>
          <button class="view-btn ${resultsView==='table'?'active':''}" data-view="table">${t().viewTable}</button>
        </div>
      </div>
      ${choosing ? `<p class="choose-hint">${t().chooseHint}</p>` : ''}
      ${resultsView === 'table' ? tableHtml(scores, highlighted, choosing) : `<div class="results-list${animate ? ' grow' : ''}">${rankingHtml(scores, highlighted, choosing, totalVoters, picked)}</div>`}
      ${picked && resultsView === 'table' ? `
        <div class="announce-block">
          <button class="btn-submit" id="btn-announce">${escHtml(t().btnAnnounce(formatDateNoYear(chosenDate)))}</button>
          <div class="announce-hint">${t().announceHint}</div>
          <div class="device-msg" id="owner-msg"></div>
        </div>` : ''}`;

    el.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', () => {
      resultsView = btn.dataset.view;
      store.set('dooodle-results-view', resultsView);
      renderResults(true);
    }));
    el.querySelectorAll('[data-choose]').forEach(btn => btn.addEventListener('click', () => {
      chosenDate = btn.dataset.choose;
      renderResults();
    }));
    el.querySelector('[data-unchoose]')?.addEventListener('click', () => {
      chosenDate = null;
      renderResults();
    });
    document.getElementById('btn-announce')?.addEventListener('click', announceDate);
  }

  function rankingHtml(scores, highlighted, choosing, totalVoters, picked) {
    const max = scores[0].score || 1;
    return scores.map((item, i) => {
      const yesPct = Math.round(item.yes.length / max * 100);
      const maybePct = Math.round(item.maybe.length * 0.5 / max * 100);
      const isTop = item.date === highlighted;
      const totalCount = item.yes.length + item.maybe.length;
      const scoreText = item.maybe.length > 0
        ? `<span class="score-yes">${item.yes.length}</span><span class="score-maybe">+${item.maybe.length}?</span><span class="score-total">/${totalVoters}</span>`
        : `<span class="score-yes">${item.yes.length}</span><span class="score-total">/${totalVoters}</span>`;
      const voters = `
            ${item.yes.map(n => `<span class="voter-pill">${escHtml(n)}</span>`).join('')}
            ${item.maybe.map(n => `<span class="voter-pill maybe">${escHtml(n)}</span>`).join('')}
            ${totalCount === 0 ? `<span class="nobody">${t().nobodyAvail}</span>` : ''}`;
      return `<div class="result-item ${isTop ? 'top' : ''}">
          <div class="result-top-row">
            <span class="rank-num ${i === 0 ? 'gold' : ''}">${i + 1}</span>
            <span class="result-date-label">${cap(formatDateShort(item.date))}</span>
            <span class="result-score">${scoreText}</span>
          </div>
          <div class="result-bar-stack">
            <div class="result-bar-yes" style="width:${yesPct}%"></div>
            <div class="result-bar-maybe" style="width:${maybePct}%"></div>
          </div>
          ${!choosing ? `<div class="result-voters">${voters}</div>`
            // The picked date carries its own announce button: no scrolling to the bottom of the list
            : item.date === picked ? `<div class="result-voters">${voters}</div>
              <div class="announce-inline">
                <button class="btn-submit" id="btn-announce">${t().btnAnnounceThis}</button>
                <div class="announce-hint">${t().announceHint}</div>
                <button class="link-btn" data-unchoose>${t().btnCancel}</button>
                <div class="device-msg" id="owner-msg"></div>
              </div>`
            : `<div class="result-bottom-row"><div class="result-voters">${voters}</div><button class="btn-choose" data-choose="${item.date}">${t().btnChoose}</button></div>`}
        </div>`;
    }).join('');
  }

  // Participants × dates grid, in calendar order. Scrolls sideways when there are many dates.
  function tableHtml(scores, highlighted, choosing) {
    const votes = poll.votes || {};
    const byDate = Object.fromEntries(scores.map(s => [s.date, s]));
    const part = (d, opt) => new Date(d+'T12:00:00').toLocaleDateString(t().locale, opt).replace('.', '');
    const best = d => d === highlighted ? ' class="best"' : '';
    const head = poll.dates.map(d => `<th${best(d)}${choosing ? ` data-choose="${d}" style="cursor:pointer"` : ''}>
        <span class="col-dow">${part(d,{weekday:'short'})}</span>
        <span class="col-day">${part(d,{day:'numeric'})}</span>
        <span class="col-month">${part(d,{month:'short'})}</span></th>`).join('');
    const rows = Object.keys(votes).map(name => {
      const v = normalizeVote(votes[name]);
      const cells = poll.dates.map(d => {
        const state = v[d];
        return `<td${best(d)}><span class="cell ${state || ''}">${state === 'yes' ? '✓' : state === 'maybe' ? '?' : '✕'}</span></td>`;
      }).join('');
      return `<tr><th class="row-name" scope="row">${escHtml(name)}</th>${cells}</tr>`;
    }).join('');
    const totals = poll.dates.map(d => {
      const s = byDate[d];
      return `<td${best(d)}>${s.yes.length}${s.maybe.length ? ` +${s.maybe.length}` : ''}</td>`;
    }).join('');
    return `
      <div class="table-wrap">
        <table class="vote-table">
          <thead><tr><th class="row-name"></th>${head}</tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><th class="row-name" scope="row">${t().tableTotal}</th>${totals}</tr></tfoot>
        </table>
      </div>
      <div class="vote-legend table-legend">
        <span class="legend-item"><span class="legend-swatch yes"></span>${t().legendYes}</span>
        <span class="legend-item"><span class="legend-swatch maybe"></span>${t().legendMaybe}</span>
        <span class="legend-item"><span class="legend-swatch no"></span>${t().legendNoShort}</span>
      </div>`;
  }

  function copyLink(){
    navigator.clipboard.writeText(shareUrl).then(()=>{
      const btn=document.getElementById('copy-btn'); if(!btn) return;
      btn.textContent=t().btnCopied; btn.classList.add('copied');
      setTimeout(()=>{btn.textContent=t().btnCopy;btn.classList.remove('copied');},2500);
    });
  }

  /* --- Language toggle --- */
  function applyStaticTranslations() {
    const lang = getLang();
    document.documentElement.lang = lang;
    document.getElementById('lang-fr').classList.toggle('active', lang==='fr');
    document.getElementById('lang-en').classList.toggle('active', lang==='en');
    document.getElementById('btn-new-poll').innerHTML = `<span class="long">${t().btnNewPoll}</span><span class="short">${t().btnNewPollShort}</span>`;
    document.getElementById('account-link').setAttribute('aria-label', t().btnMyPolls);
    document.getElementById('loading-poll-text').textContent = t().loadingPoll;
    document.getElementById('err-title').textContent = t().errNotFound;
    document.getElementById('err-sub').textContent = t().errNotFoundSub;
    document.getElementById('footer-tagline').textContent = t().footer;
    renderThemeSwitch(document.getElementById('theme-switch'));
  }

  document.getElementById('lang-fr').addEventListener('click', () => switchLanguage('fr'));
  document.getElementById('lang-en').addEventListener('click', () => switchLanguage('en'));

  function switchLanguage(lang) {
    setLang(lang);
    applyStaticTranslations();
    rerender();
  }

  function updateAccountLink() {
    document.getElementById('account-link').hidden = !currentUser;
  }

  // The organiser's session arrives after the page: show their controls when it does
  auth.onAuthStateChanged(user => {
    const changed = (user ? user.uid : null) !== (currentUser ? currentUser.uid : null);
    currentUser = user;
    updateAccountLink();
    if (changed) rerender();
  });

  applyStaticTranslations();
  loadPoll();
</script>
</body>
</html>
