<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="robots" content="noindex" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/x-icon" href="images/favicon.ico?v=2" />
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png?v=2" />
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png?v=2" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=2" />
<title>Dooodle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
<script src="theme.js?v=20261019a"></script>
<link rel="stylesheet" href="theme.css?v=20261022a" />
<style>
  .page-wrap { max-width: 640px; width: 100%; margin: 0 auto; padding: 1rem 1.25rem 2rem; flex: 1; display: flex; flex-direction: column; gap: 1rem; }
  h1 { font-size: clamp(2rem, 8vw, 2.5rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  #content { display: flex; flex-direction: column; gap: 10px; }
  .section-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); margin-top: 0.6rem; display: flex; align-items: center; gap: 8px; }
  .section-label::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--pop); }
  .section-label.closed::before { background: var(--yes); }

  .poll-card { background: var(--surface); border: 2px solid var(--edge-line); border-radius: var(--radius-lg); box-shadow: 4px 4px 0 var(--edge); padding: 0.9rem 1.05rem; display: flex; flex-direction: column; gap: 8px; transition: transform var(--d-fast) var(--ease-out), box-shadow var(--d-fast) var(--ease-out); }
  .poll-card:has(.poll-title:active) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--edge); }
  .poll-card.closed { box-shadow: 4px 4px 0 var(--yes); }
  .poll-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .poll-title { font-size: 1.08rem; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
  .poll-title::after { content: ''; position: absolute; inset: 0; }
  .poll-card { position: relative; }
  .status { flex-shrink: 0; padding: 2px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; background: var(--pop-soft); color: var(--pop-ink); }
  .status.closed { background: var(--yes); color: var(--on-yes); }
  .poll-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 0.82rem; font-weight: 500; color: var(--ink-soft); }
  .poll-meta b { color: var(--yes-ink); font-weight: 800; }
  .btn-delete { position: relative; z-index: 1; margin-left: auto; background: none; border: none; padding: 4px 0; font-size: 0.78rem; font-weight: 700; color: var(--ink-muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .btn-delete:hover { color: var(--no-ink); }

  .info-card { background: var(--surface); border: 2px solid var(--edge-line); border-radius: var(--radius-lg); box-shadow: 4px 4px 0 var(--maybe); padding: 1rem 1.1rem; margin-top: 0.5rem; display: flex; flex-direction: column; gap: 12px; }
  .info-text { font-size: 0.88rem; color: var(--ink-soft); line-height: 1.5; }
  .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0.75rem; border: 2px solid var(--ink); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 0.92rem; font-weight: 800; cursor: pointer; }
  .btn-google:disabled { opacity: 0.6; cursor: default; }
  .g-badge { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 0.78rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .msg-error { text-align: center; font-size: 0.8rem; font-weight: 600; color: var(--no-ink); }
  .msg-error:empty { display: none; }
  .empty-msg { text-align: center; padding: 2rem 1rem 0.5rem; color: var(--ink-soft); font-size: 0.95rem; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .empty-msg .loader span { animation: none; }
  .empty-msg .hdr-pill { font-size: 0.88rem; padding: 8px 16px; }

  .account-row { margin-top: auto; padding-top: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 2px dashed var(--line); font-size: 0.82rem; color: var(--ink-soft); }
  .account-row:empty { display: none; }
  .page-loader { padding: 3rem 0; }
</style>
</head>
<body>

<header class="site-header">
  <a class="logo intro" href="index.html" aria-label="Dooodle">D<span class="dot y"></span><span class="dot m"></span><span class="dot n"></span>dle</a>
  <span class="spacer"></span>
  <a class="hdr-pill primary" id="btn-new-poll" href="index.html"></a>
  <div class="lang-toggle">
    <button class="lang-btn" id="lang-fr">FR</button>
    <button class="lang-btn" id="lang-en">EN</button>
  </div>
</header>

<div class="page-wrap">
  <h1 id="page-title"></h1>
  <div id="content"><div class="loader page-loader"><span></span><span></span><span></span></div></div>
  <div class="account-row" id="account-row"></div>
</div>

<footer class="site-footer">
  <div class="theme-switch" id="theme-switch"></div>
  <a class="powered-by" href="https://nuxo.be" target="_blank" rel="noopener">Powered by <img src="images/nuxo-logo.svg" alt="Nuxo"></a>
  <span id="footer-tagline"></span>
</footer>

<script src="i18n.js?v=20261019b"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=20261014b"></script>
<script src="auth.js?v=20261014b"></script>
<script>
  let polls = null;      // null = not loaded yet
  let loadError = false;
  let loadedFor = null;  // uid the list was loaded for

  function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function formatDateShort(str) { return new Date(str+'T12:00:00').toLocaleDateString(t().locale,{weekday:'short',day:'numeric',month:'short'}); }
  function isClosed(p) { return p.closed === true && (p.dates || []).includes(p.finalDate); }

  // Same ranking as the poll page: yes=1, maybe=0.5, then number of "yes"
  function leadingDate(p) {
    const votes = Object.values(p.votes || {});
    if (votes.length === 0) return null;
    const score = d => votes.reduce((acc, v) => {
      const state = Array.isArray(v) ? (v.includes(d) ? 'yes' : null) : (v || {})[d];
      return [acc[0] + (state === 'yes' ? 1 : state === 'maybe' ? 0.5 : 0), acc[1] + (state === 'yes' ? 1 : 0)];
    }, [0, 0]);
    const ranked = p.dates.map(d => ({ d, s: score(d) })).sort((a, b) => b.s[0] - a.s[0] || b.s[1] - a.s[1]);
    return ranked[0].s[0] > 0 ? ranked[0].d : null;
  }

  async function loadPolls(user) {
    loadedFor = user.uid; polls = null; loadError = false;
    render();
    try {
      // The security rules only accept this exact filter: one's own polls
      const snap = await db.collection('polls').where('ownerUid', '==', user.uid).get();
      if (loadedFor !== user.uid) return;
      polls = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))
        .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    } catch(e) { console.error(e); loadError = true; polls = []; }
    render();
  }

  function cardHtml(p) {
    const closed = isClosed(p);
    const voters = Object.keys(p.votes || {}).length;
    const date = closed ? p.finalDate : leadingDate(p);
    return `<div class="poll-card${closed ? ' closed' : ''}">
      <div class="poll-card-top">
        <a class="poll-title" href="poll.html?id=${encodeURIComponent(p.id)}">${escHtml(p.title)}</a>
        <span class="status ${closed ? 'closed' : ''}">${closed ? t().closedPill : t().statusOpen}</span>
      </div>
      <div class="poll-meta">
        <span>${t().participants(voters)}</span>
        ${date ? `<span>${closed ? t().retained : t().leading} : <b>${escHtml(formatDateShort(date))}</b></span>` : ''}
        <button class="btn-delete" data-delete="${escHtml(p.id)}">${t().btnDelete}</button>
      </div>
    </div>`;
  }

  function googleButtonHtml() {
    return `<button class="btn-google" id="btn-google"><span class="g-badge">G</span>${t().btnGoogle}</button><div class="msg-error" id="google-msg"></div>`;
  }

  function render() {
    const user = auth.currentUser;
    const content = document.getElementById('content');
    const account = document.getElementById('account-row');
    account.innerHTML = '';

    if (!user) {
      content.innerHTML = `<div class="info-card"><div class="info-text">${t().signInPrompt}</div>${googleButtonHtml()}</div>`;
    } else if (polls === null) {
      content.innerHTML = '<div class="loader page-loader"><span></span><span></span><span></span></div>';
    } else {
      const open = polls.filter(p => !isClosed(p)), closed = polls.filter(isClosed);
      content.innerHTML =
        (loadError ? `<div class="empty-msg">${t().errLoadPolls}</div>` : polls.length === 0 ? `<div class="empty-msg"><div class="loader"><span></span><span></span><span></span></div>${t().noPolls}<a class="hdr-pill primary" href="index.html">${t().btnNewPoll}</a></div>` : '') +
        (open.length ? `<div class="section-label">${t().sectionOpen}</div>${open.map(cardHtml).join('')}` : '') +
        (closed.length ? `<div class="section-label closed">${t().sectionClosed}</div>${closed.map(cardHtml).join('')}` : '') +
        (user.isAnonymous ? `<div class="info-card"><div class="info-text">${t().myPollsDeviceHint}</div>${googleButtonHtml()}</div>` : '');
      if (isGoogleUser(user)) {
        account.innerHTML = `<span>${escHtml(t().signedInAs(displayName(user)))}</span><button class="link-btn" id="btn-signout">${t().btnSignOut}</button>`;
      }
    }

    document.getElementById('btn-google')?.addEventListener('click', connectGoogle);
    document.getElementById('btn-signout')?.addEventListener('click', () => auth.signOut());
    content.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => deletePoll(btn.dataset.delete)));
  }

  async function connectGoogle() {
    const btn = document.getElementById('btn-google');
    const msg = document.getElementById('google-msg');
    btn.disabled = true; msg.textContent = '';
    try {
      const user = await signInWithGoogle();
      // Linking keeps the same session, so no auth event fires: reload by hand
      if (user) { loadPolls(auth.currentUser); return; }
    } catch(e) {
      if (!isUserCancel(e)) { console.error(e); msg.textContent = t().errGoogle; }
    }
    btn.disabled = false;
  }

  async function deletePoll(id) {
    const p = polls.find(x => x.id === id);
    if (!p || !confirm(t().confirmDelete(p.title))) return;
    try {
      await db.collection('polls').doc(id).delete();
      polls = polls.filter(x => x.id !== id);
      render();
    } catch(e) { console.error(e); alert(t().errOwnerAction); }
  }

  function applyStaticTranslations() {
    const lang = getLang();
    document.documentElement.lang = lang;
    document.title = `${t().btnMyPolls} | Dooodle`;
    document.getElementById('lang-fr').classList.toggle('active', lang==='fr');
    document.getElementById('lang-en').classList.toggle('active', lang==='en');
    document.getElementById('btn-new-poll').textContent = t().btnNewPoll;
    document.getElementById('page-title').textContent = t().btnMyPolls;
    document.getElementById('footer-tagline').textContent = t().footer;
    renderThemeSwitch(document.getElementById('theme-switch'));
  }

  document.getElementById('lang-fr').addEventListener('click', () => { setLang('fr'); applyStaticTranslations(); render(); });
  document.getElementById('lang-en').addEventListener('click', () => { setLang('en'); applyStaticTranslations(); render(); });

  applyStaticTranslations();
  auth.onAuthStateChanged(user => {
    if (user) loadPolls(user);
    else { polls = null; loadedFor = null; render(); }
  });
</script>
<script src="pwa-install.js?v=20261019a" data-app="Dooodle" data-key="dooodle" data-icon="images/android-chrome-192x192.png?v=2" data-accent="#ec3f86" data-font="Bricolage Grotesque" data-sub-fr="Vos sondages en un geste" data-sub-en="Your polls in one tap"></script>
</body>
</html>
