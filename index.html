<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/x-icon" href="images/favicon.ico?v=2" />
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png?v=2" />
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png?v=2" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=2" />
<title>Dooodle</title>
<meta name="description" content="Créez un sondage de dates en 30 secondes et partagez le lien. Sans compte, sans pub." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Dooodle" />
<meta property="og:title" content="Dooodle, trouvez la date parfaite" />
<meta property="og:description" content="Indiquez vos disponibilités en quelques secondes. Sans compte, sans pub." />
<meta property="og:image" content="https://doodle.nuxo.be/images/og.png?v=2" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
<script src="theme.js?v=20261019a"></script>
<link rel="stylesheet" href="theme.css?v=20261019d" />
<style>
  .hero { padding: 1.75rem 1.25rem 0.5rem; max-width: 580px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 0.7rem; }
  .hero h1 { font-size: clamp(2.3rem, 9vw, 3.1rem); font-weight: 800; line-height: 0.98; letter-spacing: -0.04em; text-wrap: balance; }
  .hero h1 em { font-style: normal; color: var(--pop); }
  .hero p { font-size: 1rem; color: var(--ink-soft); max-width: 34ch; }

  .form-wrap { max-width: 580px; margin: 1.25rem auto 2.5rem; padding: 0 1.25rem; width: 100%; display: flex; flex-direction: column; gap: 1.1rem; }
  .card-fields { display: flex; flex-direction: column; gap: 0.35rem; }
  .card-fields .field-label + input { margin-bottom: 0.65rem; }
  .creator-hint { font-size: 0.78rem; color: var(--ink-muted); margin-top: -0.25rem; }

  .cal-day.past { opacity: 0.28; }
  .cal-day.today { border-color: var(--line); border-style: dashed; }
  .cal-day.free { cursor: pointer; }
  .cal-day.selected { background: var(--pop); color: var(--on-pop); font-weight: 800; }
  @media (hover: hover) {
    .cal-day.free:not(.selected):hover { background: var(--pop-soft); color: var(--pop-ink); }
  }

  .error-msg { font-size: 0.85rem; font-weight: 600; color: var(--no-ink); min-height: 1.2em; text-align: center; margin-top: -0.4rem; }

  .loading-overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
  .loading-text { font-size: 0.95rem; font-weight: 600; color: var(--ink-soft); }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo intro" aria-label="Dooodle">D<span class="dot y"></span><span class="dot m"></span><span class="dot n"></span>dle</div>
  <span class="spacer"></span>
  <a class="hdr-pill" id="my-polls-link" href="sondages.html"></a>
  <div class="lang-toggle">
    <button class="lang-btn" id="lang-fr">FR</button>
    <button class="lang-btn" id="lang-en">EN</button>
  </div>
</header>

<div class="hero">
  <h1 id="hero-title"></h1>
  <p id="hero-sub"></p>
</div>

<div class="form-wrap">
  <div class="card card-fields">
    <label class="field-label" id="label-event-title" for="event-title"></label>
    <input type="text" id="event-title" maxlength="80" />
    <label class="field-label" id="label-creator-name" for="creator-name"></label>
    <input type="text" id="creator-name" maxlength="40" />
    <p class="creator-hint" id="creator-name-hint"></p>
  </div>

  <div class="card">
    <span class="field-label" id="label-dates"></span>
    <div class="cal-nav">
      <span class="cal-month-label" id="month-label"></span>
      <div class="cal-nav-btns">
        <button class="cal-nav-btn" id="prev-month" aria-label="Mois précédent"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="cal-nav-btn" id="next-month" aria-label="Mois suivant"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div class="gm-grid" id="cal-grid"></div>
  </div>

  <button class="btn-main" id="btn-create"></button>
  <div class="error-msg" id="error-msg" role="alert"></div>
</div>

<div class="loading-overlay" id="loading" hidden>
  <div class="loader"><span></span><span></span><span></span></div>
  <div class="loading-text" id="loading-text"></div>
</div>

<footer class="site-footer">
  <div class="theme-switch" id="theme-switch"></div>
  <a class="powered-by" href="https://nuxo.be" target="_blank" rel="noopener">Powered by <img src="images/nuxo-logo.svg" alt="Nuxo"></a>
  <span id="footer-tagline"></span>
</footer>

<script src="i18n.js?v=20261019b"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=20261014b"></script>
<script src="auth.js?v=20261014b"></script>
<script>
  const selectedDates = new Set();
  const today = new Date(); today.setHours(0,0,0,0);
  let viewYear = today.getFullYear(), viewMonth = today.getMonth();

  function toKey(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  function cap(s) { return s.charAt(0).toUpperCase()+s.slice(1); }
  function toSlug(title) {
    const base = title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\u0142\u0141]/g,'l')
      .toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-')
      .replace(/^-|-$/g,'').slice(0,50) || 'sondage';
    // Suffixe al\u00e9atoire syst\u00e9matique : l'URL ne se devine pas \u00e0 partir du titre
    const alphabet = 'abcdefghijkmnpqrstuvwxyz23456789';
    const rand = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => alphabet[b % alphabet.length]).join('');
    return `${base}-${rand}`;
  }

  function applyTranslations() {
    const lang = getLang();
    document.documentElement.lang = lang;
    document.getElementById('lang-fr').classList.toggle('active', lang==='fr');
    document.getElementById('lang-en').classList.toggle('active', lang==='en');
    document.getElementById('hero-title').innerHTML = t().heroTitle;
    document.getElementById('hero-sub').textContent = t().heroSub;
    document.getElementById('label-event-title').textContent = t().labelEventTitle;
    document.getElementById('event-title').placeholder = t().placeholderEventTitle;
    document.getElementById('label-creator-name').textContent = t().labelCreatorName;
    document.getElementById('creator-name').placeholder = t().placeholderCreatorName;
    document.getElementById('creator-name-hint').textContent = t().creatorNameHint;
    document.getElementById('label-dates').textContent = t().labelDates;
    document.getElementById('loading-text').textContent = t().loadingCreate;
    document.getElementById('footer-tagline').textContent = t().footer;
    document.getElementById('my-polls-link').textContent = t().btnMyPolls;
    renderThemeSwitch(document.getElementById('theme-switch'));
    renderCalendar();
    updateCreateButton();
  }

  document.getElementById('lang-fr').addEventListener('click', () => { setLang('fr'); applyTranslations(); });
  document.getElementById('lang-en').addEventListener('click', () => { setLang('en'); applyTranslations(); });

  function renderCalendar(poppedKey) {
    const label = document.getElementById('month-label');
    const grid  = document.getElementById('cal-grid');
    label.textContent = cap(new Date(viewYear,viewMonth,1).toLocaleDateString(t().locale,{month:'long',year:'numeric'}));
    let cells = t().dayHeaders.map(h => `<div class="gm-dow">${h}</div>`).join('');
    const startDow = (new Date(viewYear,viewMonth,1).getDay()+6)%7;
    for(let i=0;i<startDow;i++) cells += '<div></div>';
    const dim = new Date(viewYear,viewMonth+1,0).getDate();
    for(let day=1;day<=dim;day++){
      const key=toKey(viewYear,viewMonth,day);
      const date=new Date(key+'T12:00:00');
      const isPast=date<today, isToday=date.getTime()===today.getTime(), isSel=selectedDates.has(key);
      const cls='gm cal-day'+(isPast?' past':' free')+(isToday?' today':'')+(isSel?' selected':'')+(key===poppedKey&&isSel?' pop':'');
      cells += isPast
        ? `<div class="${cls}">${day}</div>`
        : `<div class="${cls}" data-key="${key}" role="button" tabindex="0" aria-pressed="${isSel}">${day}</div>`;
    }
    grid.innerHTML = cells;
    renderNavBadges();
  }

  // The calendar shows one month at a time: the arrows count the dates picked elsewhere
  function renderNavBadges() {
    const cur = toKey(viewYear, viewMonth, 1).slice(0, 7);
    const keys = [...selectedDates];
    const before = keys.filter(k => k.slice(0, 7) < cur).length;
    const after = keys.filter(k => k.slice(0, 7) > cur).length;
    const prev = document.getElementById('prev-month'), next = document.getElementById('next-month');
    prev.disabled = viewYear === today.getFullYear() && viewMonth === today.getMonth();
    [[prev, before], [next, after]].forEach(([btn, n]) => {
      const old = btn.querySelector('.badge');
      if (old) old.remove();
      btn.removeAttribute('title');
      if (n > 0) {
        btn.insertAdjacentHTML('beforeend', `<span class="badge">${n}</span>`);
        btn.title = t().navBadge(n);
      }
    });
  }

  function updateCreateButton() {
    const btn = document.getElementById('btn-create');
    const n = selectedDates.size;
    btn.classList.toggle('muted', n < 2);
    btn.innerHTML = n < 2 ? t().btnNeedDates(n) : t().btnCreateCount(n);
  }

  function toggleDate(key) {
    if(selectedDates.has(key)) selectedDates.delete(key); else selectedDates.add(key);
    renderCalendar(key);
    updateCreateButton();
    if (selectedDates.size >= 2 && document.getElementById('error-msg').textContent === t().errNoDates) {
      document.getElementById('error-msg').textContent = '';
    }
  }

  const calGrid = document.getElementById('cal-grid');
  calGrid.addEventListener('click', e => { const el = e.target.closest('[data-key]'); if (el) toggleDate(el.dataset.key); });
  calGrid.addEventListener('keydown', e => {
    const el = e.target.closest('[data-key]');
    if (el && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); toggleDate(el.dataset.key);
      calGrid.querySelector(`[data-key="${el.dataset.key}"]`)?.focus();
    }
  });

  document.getElementById('prev-month').addEventListener('click',()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--;}renderCalendar();});
  document.getElementById('next-month').addEventListener('click',()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++;}renderCalendar();});

  document.getElementById('btn-create').addEventListener('click', async()=>{
    const title=document.getElementById('event-title').value.trim();
    const errEl=document.getElementById('error-msg');
    errEl.textContent='';
    if(!title){errEl.textContent=t().errNoTitle;return;}
    if(selectedDates.size<2){errEl.textContent=t().errNoDates;return;}
    document.getElementById('loading').hidden=false;
    document.getElementById('btn-create').disabled=true;
    try {
      const creatorName = document.getElementById('creator-name').value.trim();
      const sortedDates = Array.from(selectedDates).sort();
      const initialVotes = creatorName
        ? { [creatorName]: Object.fromEntries(sortedDates.map(d => [d, 'yes'])) }
        : {};
      const slug=toSlug(title);
      const pollData={slug,title,dates:sortedDates,votes:initialVotes,createdAt:new Date().toISOString()};
      if(creatorName) pollData.lastVoter=creatorName;
      // The organiser is whoever holds this session: it is what allows announcing the date later
      const owner=await ensureOwnerSession();
      if(owner) pollData.ownerUid=owner.uid;
      await db.collection('polls').doc(slug).set(pollData);
      if(creatorName) rememberVoter(slug, creatorName);
      window.location.href='poll.html?id='+slug+'&created=1';
    } catch(e) {
      console.error(e);
      document.getElementById('loading').hidden=true;
      document.getElementById('btn-create').disabled=false;
      document.getElementById('error-msg').textContent=t().errCreate;
    }
  });

  // Remembered on this device only: saves retyping, never shared
  function rememberVoter(pollId, name) {
    try { localStorage.setItem('dooodle-voter-'+pollId, name); localStorage.setItem('dooodle-name', name); } catch(e) {}
  }

  applyTranslations();

  authReady.then(user => {
    const input = document.getElementById('creator-name');
    let known = ''; try { known = localStorage.getItem('dooodle-name') || ''; } catch(e) {}
    if (!input.value) input.value = known || firstName(user);
  });
</script>
<script src="pwa-install.js?v=20261019a" data-app="Dooodle" data-key="dooodle" data-icon="images/android-chrome-192x192.png?v=2" data-accent="#ec3f86" data-font="Bricolage Grotesque" data-sub-fr="Vos sondages en un geste" data-sub-en="Your polls in one tap"></script>
</body>
</html>
